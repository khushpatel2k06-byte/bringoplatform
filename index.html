<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bringo Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Using global React variables instead of imports
        const { useState, useEffect, useRef } = React;

// ============================================================
// BRINGO PLATFORM - Complete MVP
// ============================================================

const DB = {
  users: [
    { id: "u1", name: "Priya Sharma", email: "priya@example.com", phone: "9876543210", avatar: "PS", created_at: "2024-01-10" },
    { id: "u2", name: "Rahul Verma", email: "rahul@example.com", phone: "9123456789", avatar: "RV", created_at: "2024-02-05" },
    { id: "u3", name: "Ananya Patel", email: "ananya@example.com", phone: "9988776655", avatar: "AP", created_at: "2024-03-12" },
  ],
  riders: [
    { id: "r1", name: "Vikram Singh", phone: "9001122334", vehicle: "Bike", status: "online", rating: 4.8, earnings: 12450, orders_completed: 87, verified: true, avatar: "VS" },
    { id: "r2", name: "Mohan Das", phone: "9005544332", vehicle: "Scooter", status: "offline", rating: 4.5, earnings: 8900, orders_completed: 61, verified: true, avatar: "MD" },
    { id: "r3", name: "Suresh Kumar", phone: "9009988776", vehicle: "Bike", status: "online", rating: 4.9, earnings: 15200, orders_completed: 112, verified: false, avatar: "SK" },
  ],
  orders: [
    { id: "ORD001", customer_id: "u1", customer_name: "Priya Sharma", rider_id: "r1", rider_name: "Vikram Singh", shop_name: "Domino's Pizza", category: "Food", item_details: "1x Farmhouse Pizza, 1x Garlic Bread", estimated_price: 520, final_price: 520, delivery_fee: 49, status: "Delivered", payment_status: "Paid", address: "14 MG Road, Ahmedabad", phone: "9876543210", bill_image: null, notes: "Extra napkins please", created_at: "2024-05-14T10:30:00", updated_at: "2024-05-14T11:45:00" },
    { id: "ORD002", customer_id: "u2", customer_name: "Rahul Verma", rider_id: null, rider_name: null, shop_name: "Apollo Pharmacy", category: "Medicine", item_details: "Crocin strips x3, Vitamin C tablets", estimated_price: 180, final_price: null, delivery_fee: 39, status: "Pending", payment_status: "Pending", address: "7 Satellite, Ahmedabad", phone: "9123456789", bill_image: null, notes: "", created_at: "2024-05-15T09:15:00", updated_at: "2024-05-15T09:15:00" },
    { id: "ORD003", customer_id: "u1", customer_name: "Priya Sharma", rider_id: "r1", rider_name: "Vikram Singh", shop_name: "D-Mart", category: "Grocery", item_details: "Milk 2L, Bread, Eggs dozen", estimated_price: 250, final_price: 265, delivery_fee: 29, status: "On the Way", payment_status: "Paid", address: "14 MG Road, Ahmedabad", phone: "9876543210", bill_image: null, notes: "Leave at door", created_at: "2024-05-15T08:00:00", updated_at: "2024-05-15T09:30:00" },
    { id: "ORD004", customer_id: "u3", customer_name: "Ananya Patel", rider_id: "r3", rider_name: "Suresh Kumar", shop_name: "Haldiram's", category: "Food", item_details: "Pav Bhaji for 2, Lassi x2", estimated_price: 340, final_price: 355, delivery_fee: 49, status: "Accepted", payment_status: "Paid", address: "22 Navrangpura, Ahmedabad", phone: "9988776655", bill_image: null, notes: "", created_at: "2024-05-15T11:00:00", updated_at: "2024-05-15T11:10:00" },
  ],
  notifications: [
    { id: "n1", user_id: "u1", message: "Your order ORD003 is on the way!", type: "order", read: false, created_at: "2024-05-15T09:30:00" },
    { id: "n2", user_id: "u2", message: "Looking for a rider for your order ORD002", type: "info", read: false, created_at: "2024-05-15T09:16:00" },
  ],
};

// GLOBAL STATE SIMULATION
let globalOrders = [...DB.orders];
let globalRiders = [...DB.riders];
let globalUsers = [...DB.users];
let listeners = [];

function subscribe(fn) { listeners.push(fn); return () => { listeners = listeners.filter(l => l !== fn); }; }
function notifyAll() { listeners.forEach(fn => fn()); }
function getOrders() { return [...globalOrders]; }
function getRiders() { return [...globalRiders]; }
function updateOrder(id, updates) {
  globalOrders = globalOrders.map(o => o.id === id ? { ...o, ...updates, updated_at: new Date().toISOString() } : o);
  notifyAll();
}
function addOrder(order) { globalOrders = [order, ...globalOrders]; notifyAll(); }
function updateRider(id, updates) { globalRiders = globalRiders.map(r => r.id === id ? { ...r, ...updates } : r); notifyAll(); }
function addRider(rider) { globalRiders = [rider, ...globalRiders]; notifyAll(); }

// UTILS
const STATUS_COLORS = {
  Pending: { bg: "#FFF3CD", text: "#856404", dot: "#FFC107" },
  Accepted: { bg: "#CCE5FF", text: "#004085", dot: "#007BFF" },
  Purchased: { bg: "#D4EDDA", text: "#155724", dot: "#28A745" },
  "On the Way": { bg: "#D1ECF1", text: "#0C5460", dot: "#17A2B8" },
  Delivered: { bg: "#D4EDDA", text: "#155724", dot: "#28A745" },
  Cancelled: { bg: "#F8D7DA", text: "#721C24", dot: "#DC3545" },
};
const STATUS_STEPS = ["Pending", "Accepted", "Purchased", "On the Way", "Delivered"];

function Badge({ status }) {
  const c = STATUS_COLORS[status] || { bg: "#eee", text: "#333", dot: "#999" };
  return (
    <span style={{ background: c.bg, color: c.text, fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 20, display: "inline-flex", alignItems: "center", gap: 5 }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: c.dot, display: "inline-block" }} />
      {status}
    </span>
  );
}

function Avatar({ initials, size = 36, color = "#FF6B2B" }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: color, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * 0.35, flexShrink: 0 }}>
      {initials}
    </div>
  );
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const bg = type === "success" ? "#1a7a4a" : type === "error" ? "#b91c1c" : "#1e40af";
  return (
    <div style={{ position: "fixed", bottom: 24, right: 24, background: bg, color: "#fff", padding: "12px 20px", borderRadius: 10, fontSize: 14, fontWeight: 500, zIndex: 9999, boxShadow: "0 4px 20px rgba(0,0,0,0.2)" }}>
      {message}
    </div>
  );
}

function useRealtimeOrders() {
  const [orders, setOrders] = useState(getOrders());
  useEffect(() => subscribe(() => setOrders(getOrders())), []);
  return orders;
}

function useRealtimeRiders() {
  const [riders, setRiders] = useState(getRiders());
  useEffect(() => subscribe(() => setRiders(getRiders())), []);
  return riders;
}

function calcDeliveryFee(price) { return price <= 200 ? 29 : price <= 500 ? 39 : 49; }
function formatTime(iso) { return new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }); }

// MAIN APP COMPONENT
function BringoPlatform() {
  const [app, setApp] = useState("customer");
  const [toast, setToast] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [adminAuth, setAdminAuth] = useState(false);
  const [page, setPage] = useState("home");
  const [adminPage, setAdminPage] = useState("dashboard");

  const showToast = (message, type = "success") => setToast({ message, type });

  return (
    <div style={{ fontFamily: "sans-serif", minHeight: "100vh", background: "#f5f5f5" }}>
      <style>{`
        .btn-orange { background: #FF6B2B; color: #fff; padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        nav { height: 60px; background: #fff; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      `}</style>

      {/* App Switcher */}
      <div style={{ position: "fixed", top: 10, right: 10, zIndex: 100, display: "flex", gap: 5, background: "#fff", padding: 5, borderRadius: 10 }}>
        <button onClick={() => setApp("customer")} style={{ padding: "5px 10px", background: app === "customer" ? "#FF6B2B" : "transparent", color: app === "customer" ? "#fff" : "#333", border: "none", borderRadius: 5 }}>Customer</button>
        <button onClick={() => setApp("admin")} style={{ padding: "5px 10px", background: app === "admin" ? "#333" : "transparent", color: app === "admin" ? "#fff" : "#333", border: "none", borderRadius: 5 }}>Admin</button>
      </div>

      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

      {app === "customer" ? (
        <CustomerApp authUser={authUser} setAuthUser={setAuthUser} page={page} setPage={setPage} showToast={showToast} />
      ) : (
        <AdminApp adminAuth={adminAuth} setAdminAuth={setAdminAuth} adminPage={adminPage} setAdminPage={setAdminPage} showToast={showToast} />
      )}
    </div>
  );
}

// SIMPLIFIED SUB-COMPONENTS
function CustomerApp({ authUser, page, setPage, setAuthUser }) {
  return (
    <div>
      <nav>
        <b style={{ color: "#FF6B2B", fontSize: 20 }}>Bringo</b>
        <div style={{ marginLeft: "auto", display: "flex", gap: 15 }}>
          <span onClick={() => setPage("home")} style={{ cursor: "pointer" }}>Home</span>
          <span onClick={() => setPage("order")} style={{ cursor: "pointer" }}>Order</span>
          {!authUser ? <button onClick={() => setAuthUser(DB.users[0])} className="btn-orange">Login</button> : <span>Hi, {authUser.name}</span>}
        </div>
      </nav>
      <div style={{ padding: 20 }}>
        {page === "home" ? <div className="card"><h1>Welcome to Bringo</h1><p>Order anything nearby!</p></div> : <PlaceOrderPage authUser={authUser} setPage={setPage} />}
      </div>
    </div>
  );
}

function PlaceOrderPage({ authUser, setPage }) {
  return (
    <div className="card" style={{ maxWidth: 500, margin: "0 auto" }}>
      <h2>Place New Order</h2>
      <input placeholder="Shop Name" style={{ width: "100%", padding: 10, margin: "10px 0" }} />
      <textarea placeholder="Items" style={{ width: "100%", padding: 10, margin: "10px 0" }} />
      <button className="btn-orange" onClick={() => { alert("Order placed!"); setPage("home"); }}>Submit Order</button>
    </div>
  );
}

function AdminApp({ adminAuth, setAdminAuth }) {
  if (!adminAuth) return <div style={{ padding: 100, textAlign: "center" }}><button onClick={() => setAdminAuth(true)} className="btn-orange">Login as Admin</button></div>;
  return (
    <div style={{ display: "flex" }}>
      <div style={{ width: 200, background: "#333", color: "#fff", minHeight: "100vh", padding: 20 }}>
        <h3>Admin Panel</h3>
        <p>Dashboard</p>
        <p>Orders</p>
        <p onClick={() => setAdminAuth(false)}>Logout</p>
      </div>
      <div style={{ flex: 1, padding: 30 }}>
        <h1>Admin Dashboard</h1>
        <div className="card">Active Orders: {DB.orders.length}</div>
      </div>
    </div>
  );
}

        // THE ON SWITCH - THIS RENDERS THE APP
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BringoPlatform />);

    </script>
</body>
</html>
